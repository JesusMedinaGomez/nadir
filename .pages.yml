media:
  input: public/media
  output: /nadir/media
content:
- name: publicaciones
  label: Publicaciones
  type: collection
  path: src/content/publicaciones
  format: json
  filename: '{primary}.json'
  view:
    primary: titulo
  fields:
  - name: slug
    label: Identificador
    type: string
    required: true
  - name: titulo
    label: Título
    type: string
    required: true
  - name: autor
    label: Autor
    type: string
  - name: genero
    label: Género
    type: string
  - name: tema
    label: Tema
    type: string
  - name: fecha
    label: Fecha
    type: string
  - name: tiempo
    label: Tiempo de lectura
    type: string
  - name: resumen
    label: Resumen
    type: text
  - name: estado
    label: Estado
    type: string
  - name: orden
    label: Orden
    type: number
  - name: contenido
    label: Cuerpo de la publicación
    type: rich-text
    options:
      format: markdown
      switcher: true
- name: pies-de-semana
  label: El pie de semana
  type: collection
  path: src/content/pies-de-semana
  format: json
  filename: '{primary}.json'
  view:
    primary: titulo
  fields:
  - name: numero
    label: Número
    type: string
    required: true
  - name: slug
    label: Identificador
    type: string
    required: true
  - name: titulo
    label: Título
    type: string
    required: true
  - name: fecha
    label: Fecha
    type: string
  - name: autor
    label: Autor
    type: string
  - name: extracto
    label: Resumen
    type: text
  - name: publicado
    label: Publicado
    type: boolean
    default: true
  - name: contenido
    label: Texto de la nota
    type: rich-text
    options:
      format: markdown
      switcher: true
- name: portada
  label: Portada y El pie de semana
  type: file
  path: src/content/portada.json
  format: json
  fields:
  - name: fraseInicio
    label: Frase principal
    type: string
  - name: fraseFinal
    label: Remate de la frase
    type: string
  - name: presentacion
    label: Presentación
    type: text
  - name: declaracionEtiqueta
    label: Nombre de la sección
    type: string
  - name: declaracionInicio
    label: Inicio de la declaración
    type: string
  - name: declaracionFinal
    label: Cierre de la declaración
    type: string
  - name: declaracionParrafo
    label: Descripción de la sección
    type: text
- name: trayectoria
  label: Trayectoria
  type: file
  path: src/content/trayectoria.json
  format: json
  fields:
  - name: introduccionEnriquecida
    label: Presentación
    type: rich-text
    options:
      format: markdown
      switcher: true
  - name: hitos
    label: Estudios y proyectos
    type: object
    list: true
    fields:
    - name: tiempo
      label: Periodo
      type: string
      required: true
    - name: tipo
      label: Categoría
      type: string
    - name: titulo
      label: Título
      type: string
      required: true
    - name: institucion
      label: Institución o proyecto
      type: string
    - name: detalleEnriquecido
      label: Descripción
      type: rich-text
      options:
        format: markdown
        switcher: true
- name: perfil
  label: Sobre mí y Nadir
  type: file
  path: src/content/perfil.json
  format: json
  fields:
  - name: biografiaEnriquecida
    label: Biografía
    type: rich-text
    options:
      format: markdown
      switcher: true
  - name: tituloIntencion
    label: Título de la intención
    type: string
  - name: intencionEnriquecida
    label: Intención editorial de Nadir
    type: rich-text
    options:
      format: markdown
      switcher: true
